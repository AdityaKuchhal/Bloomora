name: bloomora
description: AI-Driven Special Child Support Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^16.2.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.3.2
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  google_sign_in: ^6.2.1
  
  # Media & Camera
  camera: ^0.11.2
  video_player: ^2.8.2
  image_picker: ^1.0.4
  
  # AI/ML
  tflite_flutter: ^0.11.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.2.1
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0

  # Supabase
  supabase_flutter: ^2.5.0

  # Environment & Security
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  
  # Animations
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Charts & Analytics
  fl_chart: ^1.1.0
  
  # Networking
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    # - assets/images/
    # - assets/animations/
    # - assets/icons/
    # - assets/videos/
  
  # Using Google Fonts instead of custom fonts
  # fonts:
  #   - family: CustomIcons
  #     fonts:
  #       - asset: assets/fonts/custom_icons.ttf
