<!DOCTYPE html>
<html>
<head>
    <title>Bloomora Auth Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Bloomora Authentication Test</h1>
    
    <div id="status">Loading...</div>
    
    <div id="auth-section" style="display: none;">
        <h2>Sign Up Test</h2>
        <input type="email" id="email" placeholder="Enter email" />
        <input type="password" id="password" placeholder="Enter password" />
        <button onclick="signUp()">Sign Up</button>
        
        <h2>Sign In Test</h2>
        <button onclick="signIn()">Sign In</button>
        
        <h2>Sign Out Test</h2>
        <button onclick="signOut()">Sign Out</button>
    </div>
    
    <div id="user-info" style="display: none;">
        <h2>User Info</h2>
        <pre id="user-data"></pre>
    </div>

    <script>
        // Replace with your actual Supabase URL and Anon Key
        const SUPABASE_URL = 'https://zoszxbuodywrbjgtyakt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpvc3p4YnVvZHl3cmJqZ3R5YWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc3MDE0MjksImV4cCI6MjA3MzI3NzQyOX0.YO9E8ylSXxhL01wwjihh2YLCEwrNSLQF7SZknNG28AQ';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Check if Supabase is connected
        async function checkConnection() {
            try {
                const { data, error } = await supabase.from('child_profiles').select('count').limit(1);
                if (error) {
                    document.getElementById('status').innerHTML = '❌ Connection failed: ' + error.message;
                } else {
                    document.getElementById('status').innerHTML = '✅ Connected to Supabase!';
                    document.getElementById('auth-section').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('status').innerHTML = '❌ Error: ' + err.message;
            }
        }
        
        // Sign up function
        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            });
            
            if (error) {
                alert('Sign up error: ' + error.message);
            } else {
                alert('Sign up successful! Check your email for confirmation.');
                updateUserInfo();
            }
        }
        
        // Sign in function
        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            
            if (error) {
                alert('Sign in error: ' + error.message);
            } else {
                alert('Sign in successful!');
                updateUserInfo();
            }
        }
        
        // Sign out function
        async function signOut() {
            const { error } = await supabase.auth.signOut();
            if (error) {
                alert('Sign out error: ' + error.message);
            } else {
                alert('Signed out successfully!');
                updateUserInfo();
            }
        }
        
        // Update user info display
        async function updateUserInfo() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('user-data').textContent = JSON.stringify(user, null, 2);
            } else {
                document.getElementById('user-info').style.display = 'none';
            }
        }
        
        // Listen for auth state changes
        supabase.auth.onAuthStateChange((event, session) => {
            console.log('Auth state changed:', event, session);
            updateUserInfo();
        });
        
        // Initialize
        checkConnection();
        updateUserInfo();
    </script>
</body>
</html>
